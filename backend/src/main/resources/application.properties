spring.application.name=inventory-backend
spring.profiles.default=dev

inventory.db.path=./inventory.db
spring.datasource.url=jdbc:sqlite:${inventory.db.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor: un pool de una conexion evita errores SQLITE_BUSY.
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration
