name: Quality gates

on:
  push:
  pull_request:

jobs:
  proyecto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend (compila, pruebas, cobertura JaCoCo)
        working-directory: backend
        run: mvn -B verify

      - name: Frontend (pruebas con cobertura y build)
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
          npm run build

      - name: Secretos y conformidad sobre el codigo y las propuestas
        run: node docs/laboratorio-quality-gates/proyecto/gates.mjs

      - name: Repeticion de defectos del piloto
        run: node docs/laboratorio-quality-gates/proyecto/replay-defectos.mjs
